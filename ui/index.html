<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vendor Intelligence — demo</title>
<link rel="stylesheet" href="/ui/style.css">
</head>
<body>
<header class="top">
  <div class="brand">Vendor Intelligence <span class="tag">prototype · synthetic data</span></div>
  <div class="who">
    <label id="who-vendor">Vendor <select id="vendor-select"></select></label>
  </div>
</header>

<main id="vendor-view" class="grid">
  <aside class="col">
    <div id="habits" class="card"></div>
    <div id="profile" class="card"></div>
  </aside>
  <section class="col wide">
    <h2>My events</h2>
    <ul id="vendor-events" class="list"></ul>
  </section>
  <aside class="col drawer">
    <div id="chat" class="card chat">
      <div class="rowhead"><h3>Ask about my record</h3><button id="chat-reset" class="link">new chat</button></div>
      <div id="engine-bar" class="enginebar">
        <span id="engine-badge" class="pill">…</span>
        <span id="engine-text" class="fine"></span>
        <button id="engine-toggle" class="link">connect Claude</button>
      </div>
      <form id="key-form" class="keyform" hidden>
        <input id="key-input" type="password" placeholder="Anthropic API key (kept in server memory only)" autocomplete="off">
        <input id="model-input" type="text" placeholder="model (optional)" autocomplete="off">
        <button type="submit">Connect</button>
        <span id="key-msg" class="fine"></span>
      </form>
      <div id="chat-log" class="chatlog"></div>
      <div id="chat-suggest" class="sugg"></div>
      <form id="chat-form" class="chatform">
        <input id="chat-input" type="text" placeholder="e.g. why did I lose the Steel RFQ in July?" autocomplete="off">
        <button type="submit">Send</button>
      </form>
    </div>
    <div id="postmortem" class="card muted">Click a lost event to see why.</div>
    <div id="priceband" class="card"></div>
  </aside>
</main>

<script src="/ui/app.js"></script>
</body>
</html>
